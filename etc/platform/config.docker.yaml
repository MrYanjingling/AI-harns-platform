port: "32300"
graceful-timeout: 15s
max-body-bytes: 1048576
cert-file: ""
key-file: ""

redis:
  addrs:
    - redis:6379
  username: ""
  password: ""
  db: 0
  read-timeout-seconds: 3
  write-timeout-seconds: 3

mysql:
  host: mysql
  port: 3306
  username: root
  password: "harns123456"
  database: harns
  charset: utf8mb4
  max-open-conns: 50
  max-idle-conns: 10
  conn-max-lifetime-minutes: 30

migrate: true

minio:
  endpoint: minio:9000
  access-key: harns
  secret-key: harns123456
  use-ssl: false
  bucket: harns

security:
  token-header: Authorization
  token-secret: "change-me-in-production-32-bytes-min"
  expire-minutes: 60
  refresh-minutes: 10
  max-login-failed: 5
  lock-minutes: 60
  rsa-enabled: true
  captcha-ttl-seconds: 300

cors:
  allowed-origins:
    - "*"
  allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed-headers: [Authorization, Content-Type, X-Trace-Id]
  expose-headers: [X-Trace-Id]
  allow-credentials: false
  max-age-seconds: 3600

audit:
  enabled: true
  max-body-bytes: 16384
  queue-size: 1024
  retention-days: 180
  cleanup-batch-size: 1000
  batch-size: 100
  flush-interval-ms: 1000

things:
  online-ttl-seconds: 60
  # Unknown MQTT credentials are denied locally for this many seconds.
  auth-deny-cache-ttl-seconds: 3600
  # Maximum local deny-cache entries; oldest/arbitrary entries are evicted at the cap.
  auth-deny-cache-max-entries: 50000
  auth-secret: ""
  message:
    kafka-enabled: false
    kafka:
      brokers: []
      topic: "iot.things.pub-message"
      group-id: "harns-platform-things-message"
      batch-size: 100
      max-wait-ms: 1000

emqx:
  # EMQX 5 HTTP API, used for command downlink.
  api-url: "http://127.0.0.1:18083"
  ak: ""
  sk: ""
  broker: "127.0.0.1:1883"
  timeout-ms: 10000

files:
  # Maximum image upload size in bytes (10 MiB).
  max-image-bytes: 10485760

timeseries:
  # InfluxDB 3 Core storage. Disabled by default; enable when a server is available.
  enabled: false
  url: "http://127.0.0.1:8181"
  token: ""
  database: "harns_timeseries"
  debug-database: "harns_timeseries_debug"
  log-database: "harns_timeseries_log"
  # Core retention is database-level and immutable after creation.
  timeseries_data_retention: "730d"
  debug-data-retention: "7d"
  timeseries_log_retention: "1d"
  batch-size: 10000
  flush-interval-ms: 3000
  queue-size: 20000
  write-timeout-ms: 10000
  # Allowed aggregate functions for the thing time series query API.
  # raw is always allowed. All other entries must be supported by InfluxDB SQL.
  query-aggregates: [min, max, avg, count, sum, median, stddev]

telemetry:
  enabled: false
  endpoint: localhost:4318
  insecure: true
  service-name: harns-platform

logging:
  format: json
  verbosity: 2
  output: stdout
  max-size: 100
  max-backups: 7
  max-age: 7
  compress: true
  local-time: true
