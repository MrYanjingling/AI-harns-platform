openapi: 3.0.1
info:
  description: "Thing (device) batch creation, query, update and deletion."
  version: "0.1.0"
  title: "Platform Thing API"
servers:
  - url: "/api/v1"
tags:
  - name: Thing
    description: Thing management.
paths:
  /iot/things:
    post:
      tags: [Thing]
      summary: Create things in one batch.
      description: |
        Creates 1~100 things under one thing model. deviceKey is optional and
        generated when omitted. deviceSecret, token, upTopic, downTopic and
        the mqtt fields are generated by the backend. enable is fixed to 1 on
        creation.
      operationId: createThings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThingsReq' }
      responses:
        '200':
          description: Created things with credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ThingDetailVo' }
    get:
      tags: [Thing]
      summary: List things (paged).
      description: keyword matches deviceName and deviceKey. Secrets are not returned in the list.
      operationId: listThings
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Paged things
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 1 }
                      page: { type: integer, example: 1 }
                      pageSize: { type: integer, example: 10 }
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/ThingVo' }
    delete:
      tags: [Thing]
      summary: Delete things in one batch.
      description: |
        The body is a plain id array. Missing ids are ignored. cascade is
        reserved for related data and defaults to false.
      operationId: deleteThings
      parameters:
        - name: cascade
          in: query
          required: false
          description: Reserved for related data; default false.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      deleted: { type: integer, example: 2 }
  /iot/things/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    get:
      tags: [Thing]
      summary: Get a thing with credentials and online status.
      operationId: getThing
      responses:
        '200':
          description: Thing detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingDetailVo' }
    put:
      tags: [Thing]
      summary: Update mutable thing fields.
      description: |
        deviceKey, deviceSecret and token cannot be modified. enable switches
        between 1 (enabled) and 0 (disabled).
      operationId: updateThing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateThingReq' }
      responses:
        '200':
          description: Updated thing
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingDetailVo' }
  /iot/thingsAuth:
    post:
      tags: [Thing]
      summary: EMQX HTTP authenticator for things.
      description: |
        Validates clientid/username/password against the things table. Returns
        ACL rules for the property and command topics. On failure the endpoint
        returns HTTP 401 with result=deny. When things.auth-secret is set, the
        X-Things-Auth-Secret header must match.
      operationId: authenticateThing
      parameters:
        - name: X-Things-Auth-Secret
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceAuthReq' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthResp' }
        '401':
          description: Denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthResp' }
  /iot/thingsPubMessage:
    post:
      tags: [Thing]
      summary: EMQX message.publish callback.
      description: |
        Receives message.publish events. The EMQX event is converted to a
        platform DeviceMessage. When things.message.kafka-enabled is true, the
        DeviceMessage is produced to Kafka keyed by deviceKey and a background
        consumer processes it. Otherwise it is processed synchronously. Non
        message.publish events and events without client_attrs.device_key are
        ignored with 204.
      operationId: publishThingMessage
      parameters:
        - name: X-Things-Auth-Secret
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmqxPubEventMessage' }
      responses:
        '204':
          description: Accepted or ignored
        '500':
          description: Processing or Kafka publish failed
  /iot/thingsData:
    post:
      tags: [Thing]
      summary: Device HTTP data report.
      description: |
        Devices report data with the token issued at creation. The payload type
        field selects the message kind (property by default, event,
        command_reply). The raw JSON body is converted to a platform
        DeviceMessage and forwarded to the same processor used by MQTT. The
        token is looked up in Redis first (sliding 30-minute cache) and falls
        back to MySQL.
      operationId: reportThingData
      parameters:
        - name: X-Things-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
        '400':
          description: Invalid JSON body
        '401':
          description: Missing or invalid token
        '500':
          description: Processing or Kafka publish failed
components:
  schemas:
    EmqxPubEventMessage:
      type: object
      properties:
        publish_received_at: { type: integer, format: int64 }
        pub_props: { type: object, additionalProperties: true }
        qos: { type: integer }
        topic: { type: string }
        clientid: { type: string }
        client_attrs:
          type: object
          additionalProperties: { type: string }
        peerhost: { type: string }
        payload: { type: string }
        username: { type: string }
        event: { type: string }
        metadata: { type: object, additionalProperties: true }
        peername: { type: string }
        timestamp: { type: integer, format: int64 }
        node: { type: string }
        id: { type: string }
        flags: { type: object, additionalProperties: true }
    DeviceAuthReq:
      type: object
      properties:
        clientid: { type: string }
        username: { type: string }
        password: { type: string }
        client_attrs: { type: object, additionalProperties: true }
        cn: { type: string }
    DeviceAuthResp:
      type: object
      properties:
        result: { type: string, enum: [allow, deny] }
        is_superuser: { type: boolean }
        client_attrs:
          type: object
          additionalProperties: { type: string }
        expire_at: { type: integer, format: int64 }
        acl:
          type: array
          items: { $ref: '#/components/schemas/ACLRule' }
    ACLRule:
      type: object
      properties:
        permission: { type: string, enum: [allow, deny] }
        action: { type: string, enum: [publish, subscribe, all] }
        topic: { type: string }
        qos:
          type: array
          items: { type: integer }
        retain: { type: boolean }
    CreateThingsReq:
      type: object
      required: [thingModelId, things]
      properties:
        thingModelId: { type: string, maxLength: 32 }
        things:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CreateThingItem' }
    CreateThingItem:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string, maxLength: 64 }
        deviceKey:
          type: string
          description: Optional; generated when omitted.
          pattern: '^[a-zA-Z][a-zA-Z0-9_-]{3,63}$'
        deviceDesc: { type: string, maxLength: 255 }
        features:
          type: object
          additionalProperties: true
          description: Static feature values keyed by thing model feature identifier.
        image:
          type: string
          maxLength: 255
          description: MinIO object key, must start with images/ when non-empty.
    UpdateThingReq:
      type: object
      properties:
        deviceName: { type: string, maxLength: 64 }
        deviceDesc: { type: string, maxLength: 255 }
        mqttClientId: { type: string, maxLength: 64 }
        mqttUsername: { type: string, maxLength: 64 }
        mqttPassword: { type: string, maxLength: 64 }
        enable: { type: integer, enum: [0, 1] }
        features:
          type: object
          additionalProperties: true
          description: Static feature values keyed by thing model feature identifier.
        image:
          type: string
          maxLength: 255
          description: MinIO object key, must start with images/ when non-empty.
    ThingVo:
      type: object
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        thingModelId: { type: string }
        deviceName: { type: string }
        deviceKey: { type: string }
        upTopic:
          type: string
          description: Upstream topic (device to platform), iot/<deviceKey>/up. Immutable.
        downTopic:
          type: string
          description: Downstream topic (platform to device), iot/<deviceKey>/down. Immutable.
        deviceDesc: { type: string }
        mqttClientId: { type: string }
        mqttUsername: { type: string }
        enable: { type: integer, enum: [0, 1] }
        onlineStatus: { type: integer, enum: [0, 1] }
        lastActiveTime:
          type: integer
          format: int64
          nullable: true
          description: Last report data time in Unix milliseconds.
        createdUser: { type: string }
        updatedUser: { type: string }
        createdTime: { type: string, format: date-time }
        updatedTime: { type: string, format: date-time }
    ThingDetailVo:
      allOf:
        - $ref: '#/components/schemas/ThingVo'
        - type: object
          properties:
            deviceSecret: { type: string }
            token: { type: string }
            mqttPassword: { type: string }
            features:
              type: object
              additionalProperties: true
              description: Static feature values. Returned in detail only.
            image:
              type: string
              description: MinIO object key. Returned in detail only.
