openapi: 3.0.1
info:
  description: "Thing (device) batch creation, query, update and deletion."
  version: "0.1.0"
  title: "Platform Thing API"
servers:
  - url: "/api/v1"
tags:
  - name: Thing
    description: Thing management.
paths:
  /iot/things:
    post:
      tags: [Thing]
      summary: Create things in one batch.
      description: |
        Creates 1~100 things under one thing model. deviceKey is optional and
        generated when omitted. deviceSecret, token, upTopic, downTopic and
        the mqtt fields are generated by the backend. enable is fixed to 1 on
        creation.
      operationId: createThings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThingsReq' }
      responses:
        '200':
          description: Created things with credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ThingDetailVo' }
    get:
      tags: [Thing]
      summary: List things (paged).
      description: keyword matches deviceName and deviceKey; thingModelId narrows to one model. Secrets are not returned in the list.
      operationId: listThings
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 64 }
        - name: thingModelId
          in: query
          description: Return only things created from this thing model.
          schema: { type: string, maxLength: 32 }
      responses:
        '200':
          description: Paged things
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 1 }
                      page: { type: integer, example: 1 }
                      pageSize: { type: integer, example: 10 }
                      list:
                        type: array
                        items: { $ref: '#/components/schemas/ThingVo' }
    delete:
      tags: [Thing]
      summary: Delete things in one batch.
      description: |
        The body is a plain id array. Missing ids are ignored. Things are
        deleted in one transaction. After commit, MQTT clients are kicked
        asynchronously by mqttClientId, then caches are cleaned and rule/alarm
        configuration relations are cleaned asynchronously. Orphan relations may
        exist until periodic cleanup. Time series data is retained. cascade is
        reserved and defaults to false.
      operationId: deleteThings
      parameters:
        - name: cascade
          in: query
          required: false
          description: Reserved for related data; default false.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        '200':
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      deleted: { type: integer, example: 2 }
  /iot/things/timeseries:
    post:
      tags: [Thing]
      summary: Query property time series for multiple things.
      description: |
        Groups things by model key, validates requested properties, and queries
        InfluxDB with per-thing limits. Invalid things/properties are returned
        in data.errors while successful series are still returned.
      operationId: queryThingTimeSeries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThingTimeSeriesReq' }
      responses:
        '200':
          description: Time series query result
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingTimeSeriesVo' }
  /iot/things/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    put:
      tags: [Thing]
      summary: Update mutable thing fields.
      description: |
        deviceKey, deviceSecret and token cannot be modified. enable switches
        between 1 (enabled) and 0 (disabled).
      operationId: updateThing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateThingReq' }
      responses:
        '200':
          description: Updated thing
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingDetailVo' }
  /iot/things/{id}/basic:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    get:
      tags: [Thing]
      summary: Get thing basic information, credentials and connection format.
      operationId: getThingBasic
      responses:
        '200':
          description: Thing basic information
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingDetailVo' }
  /iot/things/{id}/features:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
    get:
      tags: [Thing]
      summary: Get raw device feature values.
      description: Returns feature values keyed by identifier. Model features without a device value are returned as null.
      operationId: getThingFeatures
      responses:
        '200':
          description: Device feature values
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingFeaturesVo' }
  /iot/things/{id}/shadow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 32 }
      - name: page
        in: query
        schema: { type: integer, default: 1, minimum: 1 }
      - name: pageSize
        in: query
        schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
      - name: keyword
        in: query
        description: Fuzzy match on property identifier or name.
        schema: { type: string, maxLength: 64 }
    get:
      tags: [Thing]
      summary: Get device data (model properties merged with shadow values).
      description: Returns a page of model properties merged with reported/desired shadow values. Missing values are null.
      operationId: getThingShadowData
      responses:
        '200':
          description: Device shadow
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
                  data: { $ref: '#/components/schemas/ThingShadowVo' }
  /iot/thingsAuth:
    post:
      tags: [Thing]
      summary: EMQX HTTP authenticator for things.
      description: |
        Validates clientid/username/password against the things table without an
        enable filter. Unknown credentials are cached locally by SHA-256
        fingerprint and denied for the configured TTL; known but disabled things
        are logged and denied. Returns ACL rules for enabled things. On failure
        the endpoint returns HTTP 401 with result=deny. When things.auth-secret
        is set, the X-Things-Auth-Secret header must match.
      operationId: authenticateThing
      parameters:
        - name: X-Things-Auth-Secret
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceAuthReq' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthResp' }
        '401':
          description: Denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthResp' }
  /iot/thingsPubMessage:
    post:
      tags: [Thing]
      summary: EMQX message.publish callback.
      description: |
        Receives message.publish events. The EMQX event is converted to a
        platform DeviceMessage. When things.message.kafka-enabled is true, the
        DeviceMessage is produced to Kafka keyed by deviceKey and a background
        consumer processes it. Otherwise it is processed synchronously. Non
        message.publish events and events without client_attrs.device_key are
        ignored with 204.
      operationId: publishThingMessage
      parameters:
        - name: X-Things-Auth-Secret
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmqxPubEventMessage' }
      responses:
        '204':
          description: Accepted or ignored
        '500':
          description: Processing or Kafka publish failed
  /iot/thingsData:
    post:
      tags: [Thing]
      summary: Device HTTP data report.
      description: |
        Devices report data with the token issued at creation. The payload type
        field selects the message kind (property by default, event,
        command_reply). The raw JSON body is converted to a platform
        DeviceMessage and forwarded to the same processor used by MQTT. The
        token is looked up in Redis first (sliding 30-minute cache) and falls
        back to MySQL.
      operationId: reportThingData
      parameters:
        - name: X-Things-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 200 }
                  message: { type: string, example: success }
        '400':
          description: Invalid JSON body
        '401':
          description: Missing or invalid token
        '500':
          description: Processing or Kafka publish failed
components:
  schemas:
    EmqxPubEventMessage:
      type: object
      properties:
        publish_received_at: { type: integer, format: int64 }
        pub_props: { type: object, additionalProperties: true }
        qos: { type: integer }
        topic: { type: string }
        clientid: { type: string }
        client_attrs:
          type: object
          additionalProperties: { type: string }
        peerhost: { type: string }
        payload: { type: string }
        username: { type: string }
        event: { type: string }
        metadata: { type: object, additionalProperties: true }
        peername: { type: string }
        timestamp: { type: integer, format: int64 }
        node: { type: string }
        id: { type: string }
        flags: { type: object, additionalProperties: true }
    DeviceAuthReq:
      type: object
      properties:
        clientid: { type: string }
        username: { type: string }
        password: { type: string }
        client_attrs: { type: object, additionalProperties: true }
        cn: { type: string }
    DeviceAuthResp:
      type: object
      properties:
        result: { type: string, enum: [allow, deny] }
        is_superuser: { type: boolean }
        client_attrs:
          type: object
          additionalProperties: { type: string }
        expire_at: { type: integer, format: int64 }
        acl:
          type: array
          items: { $ref: '#/components/schemas/ACLRule' }
    ACLRule:
      type: object
      properties:
        permission: { type: string, enum: [allow, deny] }
        action: { type: string, enum: [publish, subscribe, all] }
        topic: { type: string }
        qos:
          type: array
          items: { type: integer }
        retain: { type: boolean }
    CreateThingsReq:
      type: object
      required: [thingModelId, things]
      properties:
        thingModelId: { type: string, maxLength: 32 }
        things:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/CreateThingItem' }
    CreateThingItem:
      type: object
      required: [deviceName]
      properties:
        deviceName: { type: string, maxLength: 64 }
        deviceKey:
          type: string
          description: Optional; generated when omitted.
          pattern: '^[a-zA-Z][a-zA-Z0-9_-]{3,63}$'
        deviceDesc: { type: string, maxLength: 255 }
        features:
          type: object
          additionalProperties: true
          description: Static feature values keyed by thing model feature identifier.
        image:
          type: string
          maxLength: 255
          description: MinIO object key, must start with images/ when non-empty.
        debug: { type: integer, enum: [0, 1], default: 0, description: Route property data to the debug timeseries database. }
    UpdateThingReq:
      type: object
      properties:
        deviceName: { type: string, maxLength: 64 }
        deviceDesc: { type: string, maxLength: 255 }
        mqttClientId: { type: string, maxLength: 64 }
        mqttUsername: { type: string, maxLength: 64 }
        mqttPassword: { type: string, maxLength: 64 }
        enable: { type: integer, enum: [0, 1] }
        debug: { type: integer, enum: [0, 1], description: Route property data to the debug timeseries database. }
        features:
          type: object
          additionalProperties: true
          description: Static feature values keyed by thing model feature identifier.
        image:
          type: string
          maxLength: 255
          description: MinIO object key, must start with images/ when non-empty.
    ThingVo:
      type: object
      properties:
        id: { type: string }
        version: { type: integer, format: int64 }
        thingModelId: { type: string }
        deviceName: { type: string }
        deviceKey: { type: string }
        upTopic:
          type: string
          description: Upstream topic (device to platform), iot/<deviceKey>/up. Immutable.
        downTopic:
          type: string
          description: Downstream topic (platform to device), iot/<deviceKey>/down. Immutable.
        deviceDesc: { type: string }
        mqttClientId: { type: string }
        mqttUsername: { type: string }
        enable: { type: integer, enum: [0, 1] }
        debug: { type: integer, enum: [0, 1] }
        onlineStatus: { type: integer, enum: [0, 1] }
        lastActiveTime:
          type: integer
          format: int64
          nullable: true
          description: Last report data time in Unix milliseconds.
        createdUser: { type: string }
        updatedUser: { type: string }
        createdTime: { type: string, format: date-time }
        updatedTime: { type: string, format: date-time }
    ThingDetailVo:
      allOf:
        - $ref: '#/components/schemas/ThingVo'
        - type: object
          properties:
            deviceSecret: { type: string }
            token: { type: string }
            mqttPassword: { type: string }
            features:
              type: object
              additionalProperties: true
              description: Static feature values. Returned in detail only.
            image:
              type: string
              description: MinIO object key. Returned in detail only.
            thingModelKey: { type: string }
            thingModelName: { type: string }
            mqttBroker:
              type: string
              example: "127.0.0.1:1883"
            uploadFormat:
              type: string
              description: JSON string example for property reports; no collectionId.
              example: '{"type":"property","payload":[{"time":1772343234400,"property":{"temperature":0,"humidity":0,"enabled":false}}]}'
            createdBy: { $ref: '#/components/schemas/UserBriefVo' }
            updatedBy: { $ref: '#/components/schemas/UserBriefVo' }
    UserBriefVo:
      type: object
      properties:
        id: { type: string }
        userName: { type: string }
        nickName: { type: string }
    ThingFeaturesVo:
      type: object
      additionalProperties:
        nullable: true
      description: Raw feature values keyed by feature identifier; missing values are null.
    ThingShadowVo:
      type: object
      properties:
        thingId: { type: string }
        version: { type: integer, format: int64 }
        timestamp: { type: integer, format: int64 }
        properties:
          type: object
          properties:
            total: { type: integer, format: int64 }
            page: { type: integer }
            pageSize: { type: integer }
            list:
              type: array
              items: { $ref: '#/components/schemas/ThingShadowPropertyVo' }
    ThingShadowPropertyVo:
      type: object
      properties:
        identifier: { type: string }
        name: { type: string }
        dataType: { $ref: '#/components/schemas/ThingShadowDataType' }
        rwFlag: { type: string }
        required: { type: boolean }
        description: { type: string }
        custom:
          type: object
          additionalProperties: true
        sort: { type: integer }
        value:
          description: Raw reported JSON value; null when absent.
        desiredValue:
          description: Raw desired JSON value; null when absent.
    ThingTimeSeriesReq:
      type: object
      required: [things, startTime, endTime]
      properties:
        things:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/ThingTimeSeriesItem' }
        startTime:
          oneOf:
            - { type: integer, format: int64, description: Unix milliseconds }
            - { type: string, format: date-time }
        endTime:
          oneOf:
            - { type: integer, format: int64, description: Unix milliseconds }
            - { type: string, format: date-time }
        aggregate:
          type: string
          default: raw
          description: raw or an aggregate enabled by timeseries.query-aggregates (default min,max,avg,count,sum,median,stddev). Query uses the debug database when the thing debug flag is 1.
        interval: { type: string, maxLength: 16, example: "5m" }
        sort: { type: string, enum: [asc, desc], default: asc }
        limit: { type: integer, minimum: 1, maximum: 2000, default: 100 }
    ThingTimeSeriesItem:
      type: object
      required: [thingId, properties]
      properties:
        thingId: { type: string, maxLength: 32 }
        properties:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
    ThingTimeSeriesVo:
      type: object
      properties:
        aggregate: { type: string }
        interval: { type: string }
        series:
          type: array
          items: { $ref: '#/components/schemas/ThingTimeSeriesSeriesVo' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ThingTimeSeriesErrorVo' }
    ThingTimeSeriesSeriesVo:
      type: object
      properties:
        thingId: { type: string }
        modelKey: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/ThingTimeSeriesPointVo' }
        values:
          type: object
          additionalProperties: true
    ThingTimeSeriesPointVo:
      type: object
      properties:
        time: { type: integer, format: int64 }
        values:
          type: object
          additionalProperties: true
    ThingTimeSeriesErrorVo:
      type: object
      properties:
        thingId: { type: string }
        property: { type: string }
        message: { type: string }
    ThingShadowDataType:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [int, long, float, double, bool, enum, text, time, array, struct]
        unit: { type: string }
        unitName: { type: string }
        min: { type: string }
        max: { type: string }
        trueValue: { type: string }
        falseValue: { type: string }
        length: { type: string }
        enumSpec:
          type: object
          additionalProperties: true
        arraySpec:
          type: object
          additionalProperties: true
        structSpec:
          type: object
          additionalProperties: true
