openapi: 3.0.1
info:
  description: "API defining resources and operations for configuring, reading and managing Device."
  version: "0.0.3"
  title: "Gateway Manager API"
servers:
  - url: "/api/v1"
tags:
  - name: Gateway
    description: Get gateway metadata and system information.
  - name: License
    description: Import and query the gateway license.
  - name: Update
    description: Download and install gateway OTA packages.
paths:
  /systemInfo:
    get:
      tags:
        - Gateway
      summary: Get gateway system information.
      description: Get application version, commit and host system information.
      operationId: getSystemInfo
      responses:
        200:
          description: Gateway system information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoMeta'
  /gatewayMeta:
    get:
      tags:
        - Gateway
      summary: Get the gateway information.
      description: Get the gateway information.
      operationId: getGateway
      responses:
        200:
          description: The Gateway
          headers:
            ETag:
              schema:
                type: string
              description: ETag hash of the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
    put:
      tags:
        - Gateway
      summary: Update the gateway name.
      description: Update the gateway display name.
      operationId: updateGateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGatewayMetaRequest'
      responses:
        200:
          description: The updated Gateway
          headers:
            ETag:
              schema:
                type: string
              description: ETag hash of the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gateway'
        400:
          description: Invalid gateway name
  /license:
    get:
      tags:
        - License
      summary: Get the current license status.
      description: Return the in-memory license status and parsed license information.
      operationId: getLicense
      responses:
        200:
          description: Current license status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
  /license/import:
    post:
      tags:
        - License
      summary: Import a license.
      description: Verify and persist an RS256 license JWT. Only administrators may import a license.
      operationId: importLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportLicenseRequest'
      responses:
        200:
          description: The imported license status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatus'
        400:
          description: Invalid license, gateway mismatch, expired license, or unavailable public key

  /health:
    get:
      tags:
        - Gateway
      summary: Gateway health check.
      operationId: getHealth
      responses:
        200:
          description: Gateway is running
  /system/update:
    get:
      tags:
        - Update
      summary: Get the current OTA state.
      operationId: getSystemUpdate
      responses:
        200:
          description: Current installed versions and the single current update task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateState'
  /system/update/settings:
    put:
      tags:
        - Update
      summary: Update OTA and management MQTT settings.
      description: Only administrators may update OTA settings.
      operationId: updateSystemUpdateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateSettingsRequest'
      responses:
        200:
          description: Updated OTA state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateState'
        400:
          description: Invalid MQTT configuration
  /system/update/apply:
    post:
      tags:
        - Update
      summary: Install the current update task.
      description: Only administrators may install an update.
      operationId: applySystemUpdate
      responses:
        200:
          description: The update task was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateState'
        400:
          description: Update is disabled, missing, or not ready
  /system/update/reject:
    post:
      tags:
        - Update
      summary: Reject the current update task.
      description: Only administrators may reject an update.
      operationId: rejectSystemUpdate
      responses:
        200:
          description: The update task was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateState'
        400:
          description: Update is disabled, missing, or not ready

components:
  schemas:
    UpdateGatewayMetaRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '[\p{L}_0-9_\. ]+'
          description: The gateway's new display name.
          example: harnsGateway
    SystemInfoMeta:
      type: object
      properties:
        version:
          type: string
          example: 3.0.0
        releaseVersion:
          type: string
          example: 3.1.0
        backendVersion:
          type: string
          example: 3.1.0
        frontendVersion:
          type: string
          example: 3.1.1
        commitId:
          type: string
          example: 4a2931a74c24aeb64419d731f79ba64e1f34b817
        hardwareId:
          type: string
        architecture:
          type: string
          example: x86_64
        cpuModel:
          type: string
          example: Intel(R) Xeon(R) Silver 4314 CPU @ 2.40GHz
        osVersion:
          type: string
          example: Ubuntu 22.04
        kernelVersion:
          type: string
          example: 5.15.0
    Gateway:
      type: object
      properties:
        name:
          type: string
          description: The gateway's name.
          default: harnsgateway
          pattern: '[\p{L}_0-9_\. ]+'
          example: harnsgateway
        id:
          type: string
          description: The gateway's id.
          maxLength: 64
          example: f9f7d42d40b2415d90ed79a242292337
        eTag:
          type: string
          maxLength: 64
          pattern: '[a-z0-9]+'
          description: >-
            The object eTag string.
    SystemUpdateSettingsRequest:
      type: object
      required: [enabled, brokerUrl]
      properties:
        enabled:
          type: boolean
        brokerUrl:
          type: string
        username:
          type: string
        password:
          type: string
    SystemUpdateSettings:
      type: object
      properties:
        enabled:
          type: boolean
        brokerUrl:
          type: string
        username:
          type: string
        hasPassword:
          type: boolean
        updatedTime:
          type: string
          format: date-time
    SystemUpdateState:
      type: object
      properties:
        installed:
          $ref: '#/components/schemas/SystemUpdateInstalled'
        task:
          $ref: '#/components/schemas/SystemUpdateTask'
        settings:
          $ref: '#/components/schemas/SystemUpdateSettings'
    SystemUpdateInstalled:
      type: object
      properties:
        releaseVersion:
          type: string
        backendVersion:
          type: string
        backendSha256:
          type: string
        frontendVersion:
          type: string
        frontendSha256:
          type: string
    SystemUpdateTask:
      type: object
      properties:
        taskId:
          type: string
        manifestUrl:
          type: string
        state:
          type: string
          enum: [received, downloading, ready, applying, restarting, succeeded, failed, rejected, ignored]
        releaseVersion:
          type: string
        backendVersion:
          type: string
        frontendVersion:
          type: string
        restartRequired:
          type: boolean
        progress:
          type: integer
        errorCode:
          type: string
        message:
          type: string
        updatedAt:
          type: string
          format: date-time
    ImportLicenseRequest:
      type: object
      required: [data]
      properties:
        data:
          type: string
          minLength: 1
          description: RS256 license JWT generated by the license generator.
    LicenseStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unauthorized, authorized]
          description: Current authorization status.
        license:
          allOf:
            - $ref: '#/components/schemas/LicenseInfo'
          description: >-
            License data. When status is unauthorized this returns the trial
            quota (maxVariable 100) and the software run deadline.
    LicenseInfo:
      type: object
      properties:
        maxVariable:
          type: integer
          minimum: 1
          description: Maximum number of variables allowed by the license.
        contact:
          type: string
          description: License contact.
        contactEmail:
          type: string
          format: email
          description: License contact email.
        company:
          type: string
          description: Licensed company.
        licenseExpiresAt:
          type: string
          format: date-time
          description: License expiration time.
        softwareRunDeadline:
          type: string
          format: date-time
          description: Software run deadline.
